name: Build Aether Client

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Build Aether Client
        run: gradle build

      - name: Upload Aether Client JAR
        uses: actions/upload-artifact@v4
        with:
          name: Aether-Client-1.21.11
          path: build/libs/*.jar
